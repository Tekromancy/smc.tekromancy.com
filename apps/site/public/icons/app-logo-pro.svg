<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgPro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e041c" />
      <stop offset="50%" stop-color="#05020a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Purple Neon -->
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Filter for subtle glow -->
    <filter id="proGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container with Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgPro)" stroke="url(#goldGrad)" stroke-width="5"/>

  <!-- Pro Hex Shield Outer Contour -->
  <polygon points="256,60 410,130 410,290 256,410 102,290 102,130"
           stroke="url(#purpleNeon)" stroke-width="4" fill="#9333ea" fill-opacity="0.08" stroke-dasharray="14 10" />

  <!-- Bell / Sound Shield Body -->
  <g filter="url(#proGlow)">
    <path d="M196 200 C196 156, 222 130, 256 130 C290 130, 316 156, 316 200 C316 278, 348 300, 348 300 L164 300 C164 300, 196 278, 196 200 Z"
          fill="#581c87" fill-opacity="0.3" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M232 328 C236 342, 244 350, 256 350 C268 350, 276 342, 280 328"
          stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Diagonal Sonic Suppression Slash (Golden Mute Bar) -->
  <line x1="120" y1="120" x2="392" y2="392" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" filter="url(#proGlow)"/>
  <line x1="120" y1="120" x2="392" y2="392" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- PRO Gold Pill Badge -->
  <g transform="translate(196, 420)">
    <rect width="120" height="40" rx="20" fill="#1e102e" stroke="url(#goldGrad)" stroke-width="2.5" />
    <text x="60" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#fef08a" text-anchor="middle" letter-spacing="3">PRO</text>
  </g>
</svg>
