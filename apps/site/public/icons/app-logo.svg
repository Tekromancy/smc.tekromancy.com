<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140826" />
      <stop offset="50%" stop-color="#0a0314" />
      <stop offset="100%" stop-color="#05010a" />
    </linearGradient>

    <!-- Glowing Ring Gradient -->
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <!-- Slash Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Filter for subtle glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container (Standard Adaptive Icon Safe Bounds) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="#381b5c" stroke-width="4"/>

  <!-- Radar / Acoustic Waves (Silenced Field) -->
  <circle cx="256" cy="256" r="185" stroke="url(#glowRing)" stroke-width="3" opacity="0.3" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="145" stroke="#a855f7" stroke-width="4" opacity="0.5"/>
  <circle cx="256" cy="256" r="105" stroke="#9333ea" stroke-width="3" opacity="0.35"/>

  <!-- Central Bell / Sound Icon Body -->
  <g filter="url(#neonGlow)">
    <path d="M192 196 C192 148, 220 120, 256 120 C292 120, 320 148, 320 196 C320 286, 356 312, 356 312 L156 312 C156 312, 192 286, 192 196 Z"
          fill="#9333ea" fill-opacity="0.18" stroke="#f3e8ff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bell Clapper -->
    <path d="M228 344 C232 360, 243 372, 256 372 C269 372, 280 360, 284 344"
          stroke="#f3e8ff" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Diagonal Sonic Suppression Slash (Mute Bar) -->
  <line x1="108" y1="108" x2="404" y2="404" stroke="url(#slashGrad)" stroke-width="26" stroke-linecap="round" filter="url(#neonGlow)"/>
  <line x1="108" y1="108" x2="404" y2="404" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
</svg>
