<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#180b2a" />
      <stop offset="100%" stop-color="#0a0512" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Tile -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" stroke="#3b1d5c" stroke-width="1" />
  
  <!-- Outer Sonic Shield Ring -->
  <circle cx="16" cy="16" r="11" stroke="url(#primaryGrad)" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.6" />
  <circle cx="16" cy="16" r="8.5" stroke="#9333ea" stroke-width="1.5" opacity="0.4" />
  
  <!-- Stylized Bell / Silent Phone Glyph -->
  <path d="M11 11.5a5 5 0 0 1 10 0c0 5 2.5 6.5 2.5 6.5H8.5s2.5-1.5 2.5-6.5" 
        stroke="#f3e8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M14.2 21a1.8 1.8 0 0 0 3.6 0" 
        stroke="#f3e8ff" stroke-width="1.8" stroke-linecap="round" />
        
  <!-- Mute Slash Strike -->
  <line x1="6" y1="6" x2="26" y2="26" stroke="url(#accentGrad)" stroke-width="2.4" stroke-linecap="round" />
</svg>
